<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Position</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Display Position</h1>

    <h2>Display Block</h2>
    <ul class="block">
        <li>Intem1</li>
        <li>Intem2</li>
        <li>Intem3</li>
    </ul>

    <h2>Display Inline</h2>
    <ul class="inline">
        <li>Intem1</li>
        <li>Intem2</li>
        <li>Intem3</li>
    </ul>

    <h2>Display Inline Block</h2>
    <ul class="inline-block">
        <li>Intem1</li>
        <li>Intem2</li>
        <li>Intem3</li>
    </ul>

    <h2>Display None</h2>
    <ul class="none">
        <li>Intem1</li>
    </ul>
</body>
</html>
