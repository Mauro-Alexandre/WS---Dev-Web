<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Formulário de cadastro</h1>

    <form action="/" method="post">
        <label for="nome">Nome completo:</label>
        <input type="text" name="nome" id="nome" placeholder="Digite seu nome completo" required>

        <br><br>

        <label for="email">E-mail:</label>
        <input type="email" name="email" id="email" placeholder="Digite seu E-mail" required>

        <br><br>

        <label for="telefone">Telefone:</label>
        <input type="tel" name="telefone" id="telefone" placeholder="Digite seu telefone" required>

        <br><br>

        <label for="senha">Senha:</label>
        <input type="password" name="senha" id="senha" placeholder="Digite sua senha" required minlength="8">

        <br><br>

        <label for="idade">Idade:</label>
        <input type="number" name="idade" id="idade" placeholder="Digite sua idade" required>

        <br><br>

        <label for="genero">Gênero:</label>
        <select name="genero" id="genero">
            <option value="" disabled>Selecione...</option>
            <option value="feminino">Femino</option>
            <option value="masculino">Masculino</option>
            <option value="outro">Outro</option>
        </select>

        <br><br>

        <h2>Interesses</h2>

        <input type="checkbox" name="interesses" id="tecnologia" value="tecnologia">
        <label for="tecnologia">Tecnologia</label>

        <input type="checkbox" name="interesses" id="esportes" value="esportes">
        <label for="esportes">Esportes</label>

        <input type="checkbox" name="interesses" id="musica" value="musica">
        <label for="musica">Música</label>

        <br><br>

        <label for="newsletter">Deseja receber nossa newsletter?</label>

        <input type="radio" name="newsletter" id="newsletter" value="sim">
        <label for="sim">Sim</label>

        <input type="radio" name="newsletter" id="newsletter" value="nao">
        <label for="nao">Não</label>

        <br><br>

        <h2>Informções adicionais</h2>
        
        <label for="sonho">Sonhos:</label>
        <textarea name="sonho" id="sonho" rows="5" cols="20" placeholder="Conte-nos seus maiores sonhos"></textarea>
        
        <br><br>

        <label for="cor">Cor favorita:</label>
        <input type="color" name="cor" id="cor">

        <br><br>

        <label for="data">Data de nascimento:</label>
        <input type="date" name="data" id="data">

        <br><br>

        <label for="arquivo">Envie uma foto:</label>
        <input type="file" name="arquivo" id="arquivo">

        <br/><br/>

        <input type="submit">
        <button type="submit">Enviar formulário</button>

    </form>
</body>
</html>
