<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outros inputs</title>
</head>
<body>
    <h1>Outros inputs</h1>

    <label for="cor">Cor</label>
    <input type="color" name="cor" id="cor">

    <br/><br/>

    <label for="data">Data</label>
    <input type="date" name="data" id="data">

    <br/><br/>

    <label for="emal">Email</label>
    <input type="email" name="Email" id="Email" placeholder="Digite o email">

    <br/><br/>

    <label for="url">URL</label>
    <input type="url" name="url" id="url" placeholder="https://">

    <br/><br/>

    <label for="bio">Biografia</label>
    <textarea name="bio" id="bio" rows="S" cols="30" placeholder="Escreva sua biografia"></textarea>
</body>
</html>
