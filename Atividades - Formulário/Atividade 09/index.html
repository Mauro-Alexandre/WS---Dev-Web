<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 09</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Formulário</h1>

    <form action="./">
        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome" placeholder="Digite seu nome" required>

        <br><br>

        <label for="email">E-mail</label>
        <input type="email" name="nome" id="nome" placeholder="Digite seu e-mail" required>

        <br><br>

        <label for="consulta">Sua consulta:</label>
       <select name="consulta" id="consulta" required>
            <option value="consulta1">Consulta 1</option>
            <option value="consulta2">Consulta 2</option>
            <option value="consulta3">Consulta 3</option>
       </select>

       <br><br>

       <button type="submit">Enviar</button>
    </form>
</body>
</html>
