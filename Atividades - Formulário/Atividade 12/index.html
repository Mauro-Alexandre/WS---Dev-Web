<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 12</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header>
        <nav>
            <ul>
                <li>Início</li>
                <li>Sobre nós</li>
                <li>Contato </li>
            </ul>

            <img src="./Atividade 12 - logo.png" alt="logo" class="logo">
        </nav>

        
    </header>

    <form action="./">
        <h1>Inscrição em Curso</h1>

        <br>

        <div class="informacoes">
            <label for="nome">Nome completo:</label>
            <br>
            <input type="text" name="nome" id="nome" required>

            <br><br>

            <label for="email">E-mail:</label>
            <br>
            <input type="email" name="email" id="email" required>

            <br><br>

            <label for="telefone">Telefone:</label>
            <br>
            <input type="tel" name="telefone" id="telefone" minlength="11" required>
        </div>

        <br>

        <div class="cursos">
            <label for="curso">Curso desejado:</label>
            
            <select name="curso" id="curso" required>
                <option value="informatica">Informática</option>
                <option value="culinaria">Culinária</option>
                <option value="jardinagem">Jardinagem</option>
                <option value="enfermagem">Enfermagem</option>
                <option value="marketing">Marketing</option>
                <option value="estetica">Estética</option>
                <option value="adm">Administração</option>
            </select>
        </div>

        <br>
     
        <div class="periodo">
            <label for="periodo">Período:</label>
            
            <br><br>

            <label for="manha">Manhã
                <input type="radio" name="periodo" id="manha" required>
            </label>
            <br>
            <label for="tarde">Tarde
                <input type="radio" name="periodo" id="tarde" required>
            </label>
            <br>
            <label for="noite">Noite
                <input type="radio" name="periodo" id="noite" required>
            </label>
        </div>

        <br>

        <div class="materiais">
            <label for="materiais">Materiais extras:</label>
            <br><br>

            <label for="lapis">Lápis
                <input type="checkbox" name="lapis" id="lapis">
            </label>
            <br>
            <label for="canetas">Canetas
                <input type="checkbox" name="canetas" id="canetas">
            </label>
            <br>
            <label for="cadernos">Cadernos
                <input type="checkbox" name="cadernos" id="cadernos">
            </label>
        </div>
        
        <br>

        <div class="duvida">
            <label for="duvida">Tem alguma dúvida?</label>

            <br><br>

            <textarea name="duvida" id="duvida" placeholder="Nos conte sua dúvida, enviaremos um e-mail com a resposta..." name="duvida" id="duvida" rows="6" cols="50"></textarea>
        </div>

        <br><br>

        <button type="submit">Finalizar</button>
    </form>
</body>
</html>
