<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 12</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li>Início</li>
                <li>Sobre nós</li>
                <li>Contato </li>
            </ul>
        </nav>
    </header>

    <form action="./">
        <h1>Inscrição em Curso</h1>
        <br>
        <label for="nome">Nome completo:</label>
        <br>
        <input type="text" name="nome" id="nome" required>

        <br><br>

        <label for="email">E-mail</label>
        <br>
        <input type="email" name="email" id="email" required>

        <br><br>

        <label for="telefone">Telefone:</label>
        <br>
        <input type="tel" name="telefone" id="telefone" required>

        <br><br>

        <label for="curso">Curso desejado:</label>
        
        <select name="curso" id="curso" required>
            <option value="informatica">Informática</option>
            <option value="culinaria">Culinária</option>
            <option value="jardinagem">Jardinagem</option>
            <option value="enfermagem">Enfermagem</option>
            <option value="marketing">Marketing</option>
            <option value="estetica">Estética</option>
            <option value="adm">Administração</option>
        </select>

        <br><br>

        <label for="periodo">Período:</label>
        
        <br><br>

        <label for="manha">Manhã
            <input type="radio" name="manha" id="manha" required>
        </label>

        <label for="tarde">Tarde
            <input type="radio" name="tade" id="tarde" required>
        </label>

        <label for="noite">Noite
            <input type="radio" name="noite" id="noite" required>
        </label>

        <br><br>

        <label for="materiais">Materiais extras:</label>
        <br><br>

        <label for="lapis">Lápis
            <input type="checkbox" name="lapis" id="lapis">
        </label>

        <label for="canetas">Canetas
            <input type="checkbox" name="canetas" id="canetas">
        </label>

        <label for="cadernos">Cadernos
            <input type="checkbox" name="cadernos" id="cadernos">
        </label>

        <br><br>

        <label for="duvida">Tem alguma dúvida?</label>
        <br>
        <textarea name="duvida" id="duvida" placeholder="Nos conte alguma dúvida, enviaremos um e-mail com a resposta..." name="duvida" id="duvida" rows="5" cols="50"></textarea>

        <br><br>

        <button type="submit">Finalizar</button>
    </form>
</body>
</html>
