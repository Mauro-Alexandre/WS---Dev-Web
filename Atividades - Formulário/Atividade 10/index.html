<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 10</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Formulário</h1>

    <form action="./">
        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome" placeholder="Digite seu nome" required title="Digite o seu nome completo">

        <br><br>

        <label for="email">E-mail:</label>
        <input type="email" name="email" id="email" placeholder="Digite seu e-mail" required title="Digite seu e-mail">

        <br><br>

        <label for="senha">Senha:</label>
        <input type="password" name="senha" id="senha" minlength="12" placeholder="Digite sua senha" required title="Digite sua senha">

        <br><br>

        <label for="data">Data de nascimento:</label>
        <input type="date" name="data" id="data" title="Coloque sua data de nascimento" required >

        <br><br>

        <label for="genero">Gênero:</label>
        <select name="genero" id="genero" title="Coloque seu gênero" required>
            <option value="masculino">Masculino</option>
            <option value="feminino">Feminino</option>
            <option value="outro">Outro</option>
        </select>
        <br><br>
        
        <label for="termos">Você aceita nossos termos?</label>
        <input type="checkbox" name="termos" id="termos" title="Confirmação de nossos termos" required>

        <br><br>

        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>

    </form>
</body>
</html>
